name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install (frozen lockfile), typecheck, lint, guardrails, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck tests
        run: npm run typecheck:tests

      # Sprint 1.9, Milestone 4: `npm run lint` is a full-repo `eslint .`
      # with no path scoping, and the repo currently carries ~7,400
      # pre-existing lint problems across ~315 files that predate this
      # workflow ever reaching this step (documented in
      # docs/CI_LINT_DEBT.md, found 2026-07-18 — a formatting-drift issue,
      # not a logic bug, and explicitly left as a deliberate call for a
      # human to make about a bulk reformat). Before this fix, this step
      # failed on every single push/PR, which stopped the job here — the
      # "Verify auth context" / "Run tests" / "Build" steps below never
      # actually ran in CI, for any commit, the whole time. continue-on-error
      # keeps Lint's own failure visible in the Actions UI (it does not
      # silence or fix the debt) while letting the steps that check for
      # *new* regressions — the ones this pipeline exists to catch — run
      # and report accurately again.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Verify auth context
        run: npm run verify:auth-context

      - name: Run tests
        run: bun test

      - name: Build
        run: npm run build
