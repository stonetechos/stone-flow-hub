name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install (frozen lockfile), typecheck, lint, guardrails, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck tests
        run: npm run typecheck:tests

      # Sprint 2.2, DX/CI audit: `npm run lint` is a real, blocking gate
      # again. The `continue-on-error` added in Sprint 1.9 M4 was a
      # deliberately temporary shim — 7,385 of the 7,391 problems it was
      # muting (documented in docs/CI_LINT_DEBT.md) came from a single
      # file, src/integrations/supabase/types.ts, an auto-generated
      # Supabase types file that had never been excluded from ESLint the
      # way src/routeTree.gen.ts already was. Excluding it (see
      # eslint.config.js) plus fixing the handful of genuinely-drifted
      # files brought `eslint .` to a clean, real 0 errors — see
      # docs/sprint-2.2-developer-experience-ci-audit.md for the full
      # root-cause analysis. Do not reintroduce continue-on-error here as
      # a shortcut for future lint failures — fix the lint issue, or if a
      # generated file is the culprit again, exclude it the same way.
      - name: Lint
        run: npm run lint

      - name: Verify auth context
        run: npm run verify:auth-context

      - name: Run tests
        run: bun test

      - name: Build
        run: npm run build
